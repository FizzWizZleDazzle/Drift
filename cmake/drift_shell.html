<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Drift</title>
<style>
  html, body { margin: 0; height: 100%; background: #000; overflow: hidden; }
  canvas { display: block; width: 100vw; height: 100vh; outline: none; }
  #status { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center;
            color: #aaa; font: 14px sans-serif; pointer-events: none; }
</style>
</head>
<body>
<canvas id="canvas" tabindex="-1" oncontextmenu="event.preventDefault()"></canvas>
<div id="status">Loading...</div>
<script>
  var Module = {
    canvas: document.getElementById('canvas'),
    setStatus: function (text) { document.getElementById('status').textContent = text; },
    onRuntimeInitialized: function () {
      document.getElementById('status').style.display = 'none';
      document.getElementById('canvas').focus();
    },
    print: function (text) { console.log(text); },
    printErr: function (text) { console.error(text); }
  };
</script>

</body>
</html>
