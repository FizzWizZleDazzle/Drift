name: Deploy Docs

# Publishes the mdBook in docs/ to GitHub Pages, so the site describes the
# newest release. release.yml calls this after it publishes a release: the
# release is created with the workflow token, and a workflow token raises no
# events, so a `release: published` trigger here would never fire. Run it by
# hand to republish.
#
# The github-pages environment only deploys refs its branch policy allows.
# A release run is on the tag, so the policy needs a tag rule for v* beside
# main; see docs/src/reference/releasing.md.

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install mdBook
        uses: peaceiris/actions-mdbook@v2
        with:
          mdbook-version: 0.5.2

      - name: Build docs
        run: mdbook build docs

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs/book

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
