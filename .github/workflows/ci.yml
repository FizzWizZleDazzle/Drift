name: ci

# Builds Drift on every push to main and every pull request: the engine, the
# examples and the tests on Linux with each graphics backend, the same build on
# Windows and macOS, the browser build of the examples, and the docs.
#
# Linux runs the tests. Windows and macOS build only, for now: neither has
# been built before this workflow, so the first thing to learn there is whether
# it compiles. Turn ctest on for them once they build.
#
# The candela package (DRIFT_BUILD_CANDELA) stays out. It needs the candela
# toolchain, and the embedded host needs a candela branch that is not public
# yet.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # Nothing a test opens should reach a real device, and a runner has none.
  # ctest sets these for the tests that open a window as well.
  SDL_AUDIO_DRIVER: dummy
  SDL_VIDEO_DRIVER: offscreen

jobs:
  linux:
    name: linux (${{ matrix.backend }})
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - backend: gl
            flags: ""
          # The GL backend stays on beside WebGPU, so the tests run on the
          # default backend in a build that also carries the second one.
          - backend: webgpu
            flags: -DDRIFT_BACKEND_WEBGPU=ON
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/setup
        with:
          cache-key: linux-${{ matrix.backend }}
      - name: Configure
        run: >
          cmake -S . -B build -G Ninja
          -DCMAKE_BUILD_TYPE=Debug
          -DCMAKE_C_COMPILER_LAUNCHER=ccache
          -DCMAKE_CXX_COMPILER_LAUNCHER=ccache
          ${{ matrix.flags }}
      - name: Build
        run: cmake --build build
      - name: Test
        run: ctest --test-dir build --output-on-failure

  desktop:
    name: ${{ matrix.name }} (build)
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: windows
            os: windows-latest
          - name: macos
            os: macos-latest
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/setup
        with:
          cache-key: ${{ matrix.name }}
      - name: Configure
        shell: bash
        run: >
          cmake -S . -B build -G Ninja
          -DCMAKE_BUILD_TYPE=Release
          -DCMAKE_C_COMPILER_LAUNCHER=ccache
          -DCMAKE_CXX_COMPILER_LAUNCHER=ccache
      - name: Build
        run: cmake --build build

  web:
    name: web (${{ matrix.backend }})
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - backend: webgl2
            flags: ""
          - backend: webgpu
            flags: -DDRIFT_BACKEND_WEBGPU=ON
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/setup
        with:
          cache-key: web-${{ matrix.backend }}
          desktop: "false"
      - uses: mymindstorm/setup-emsdk@v14
        with:
          version: 6.0.13
          actions-cache-folder: emsdk-cache-${{ matrix.backend }}
      - name: Configure
        run: >
          emcmake cmake -S . -B build-web -G Ninja
          -DCMAKE_BUILD_TYPE=Release
          -DCMAKE_C_COMPILER_LAUNCHER=ccache
          -DCMAKE_CXX_COMPILER_LAUNCHER=ccache
          ${{ matrix.flags }}
      - name: Build
        run: cmake --build build-web

  docs:
    name: docs
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: peaceiris/actions-mdbook@v2
        with:
          mdbook-version: 0.5.2
      - run: mdbook build docs
