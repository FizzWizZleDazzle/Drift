[book]
title = "Drift for Candela"
authors = ["Drift contributors"]
language = "en"
src = "src"

[output.html]
git-repository-url = "https://github.com/FizzWizZleDazzle/Drift"
site-url = "/Drift/candela-book/"
# Shift-click a name in code to open its reference entry. The names come
# from src/reference/api-index.json, written by scripts/candela-reference.py.
additional-js = ["theme/api-links.js"]
additional-css = ["theme/api-links.css"]

# Search indexes every heading down to ### on its own, so a method such as
# `Texture.size` is a result of its own, and favors titles and headings.
[output.html.search]
enable = true
limit-results = 40
boost-title = 2
boost-hierarchy = 2
heading-split-level = 3
